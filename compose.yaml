name: litverse

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      # Configuração para testar localmente via HTTP.
      NODE_ENV: development
      TRUST_PROXY: "1"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      EMAIL_LOOKUP_KEY: ${EMAIL_LOOKUP_KEY:-}
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/litverse
      FRONTEND_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-sync:
    build: ./backend
    restart: unless-stopped
    init: true
    command: ["node", "src/catalogWorker.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/litverse
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      CATALOG_SYNC_ENABLED: ${CATALOG_SYNC_ENABLED:-true}
      CATALOG_SYNC_INTERVAL_HOURS: ${CATALOG_SYNC_INTERVAL_HOURS:-12}
      CATALOG_SYNC_PAGES: ${CATALOG_SYNC_PAGES:-3}
      CATALOG_SYNC_QUERIES: ${CATALOG_SYNC_QUERIES:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - web
      - data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

networks:
  web:
  data:
    internal: true
